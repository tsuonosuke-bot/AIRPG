name: ブラウザ版をGitHub Pagesへデプロイ

on:
  push:
    branches: [main]
    paths:
      - "GuildSimulator.Core/**"
      - "GuildSimulator.Game/**"
      - "GuildSimulator.Balance/**"
      - "GuildSimulator.Tests/**"
      - "GuildSimulator.Web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のデプロイは中断せず、最新のコミットを1件だけ待たせる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: restore
        run: dotnet restore GuildSimulator.Tests/GuildSimulator.Tests.csproj

      # MasterDataDistributionTestsがCLI配布物（Releaseビルド）とマスタデータの一致を
      # 検証するため、テスト実行前にビルドしておく。bin/objはgit管理していないので、
      # チェックアウトのたびにここで作る必要がある。
      - name: build CLI (Release, for distribution checks)
        run: dotnet build GuildSimulator.Cli/GuildSimulator.Cli.csproj -c Release -m:1 -nr:false

      - name: test
        env:
          DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: "1"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: dotnet test GuildSimulator.Tests/GuildSimulator.Tests.csproj --no-restore -c Debug -m:1 -nr:false

      - name: validate master data
        run: dotnet run --project GuildSimulator.Cli --no-build -- --validate-master

      - name: Balance Lab smoke test
        run: dotnet run --project GuildSimulator.Balance --no-build -- --runs 50 --output outputs/balance-lab/ci-smoke.json

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: publish
        run: dotnet publish GuildSimulator.Web -c Release -o publish

      - name: verify published master data
        shell: bash
        run: |
          set -euo pipefail
          canonical_manifest="$(mktemp)"
          published_manifest="$(mktemp)"
          trap 'rm -f "${canonical_manifest}" "${published_manifest}"' EXIT

          (
            cd GuildSimulator.Game/Data
            find . -maxdepth 1 -type f -name '*.json' -print0 | sort -z | xargs -0 -r sha256sum
          ) > "${canonical_manifest}"
          (
            cd publish/wwwroot/Data
            find . -maxdepth 1 -type f -name '*.json' -print0 | sort -z | xargs -0 -r sha256sum
          ) > "${published_manifest}"

          test -s "${canonical_manifest}"
          test -s "${published_manifest}"
          diff -u "${canonical_manifest}" "${published_manifest}"

      # GitHub Pagesではリポジトリ名のサブパス（/airpg/）で配信されるため、
      # ルート前提で生成されたパスを書き換える。
      - name: サブパス向けにベースURLを書き換え
        run: |
          set -eu
          base="/${GITHUB_REPOSITORY#*/}/"
          sed -i "s|<base href=\"/\" />|<base href=\"${base}\" />|g" publish/wwwroot/index.html
          sed -i "s|^const base = \"/\";|const base = \"${base}\";|g" publish/wwwroot/service-worker.js
          grep -o '<base href="[^"]*" />' publish/wwwroot/index.html
          grep -n '^const base' publish/wwwroot/service-worker.js

      # index.html を書き換えるとサービスワーカーの整合性ハッシュと合わなくなり、
      # インストールに失敗してオフライン動作とホーム画面追加が効かなくなる。
      - name: サービスワーカーの整合性ハッシュを再計算
        run: python3 .github/scripts/fix_sw_integrity.py publish/wwwroot index.html

      # _framework など下線で始まるディレクトリをJekyllに無視されないようにする。
      - name: .nojekyll を配置
        run: touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
