<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <!-- スマホで画面いっぱいに表示する。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ギルドシミュレーター</title>
    <base href="/" />
    <meta name="theme-color" content="#10131a" />
    <script>
        // 保存済みテーマをBlazor起動前に反映し、白い画面の点滅を防ぐ。
        try {
            if (localStorage.getItem('guildsim.theme') === 'eink') {
                document.documentElement.dataset.theme = 'eink';
                document.querySelector('meta[name="theme-color"]').content = '#ffffff';
            }
        } catch { }
    </script>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        エラーが発生しました。
        <a href="" class="reload">再読み込み</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        const guildSimThemeKey = 'guildsim.theme';

        window.guildSim = {
            scrollOutputToEnd: function () {
                const output = document.getElementById('output');
                if (output) output.scrollTop = output.scrollHeight;
            },
            getTheme: function () {
                return document.documentElement.dataset.theme === 'eink' ? 'eink' : 'dark';
            },
            setTheme: function (theme) {
                const value = theme === 'eink' ? 'eink' : 'dark';
                if (value === 'eink') {
                    document.documentElement.dataset.theme = 'eink';
                } else {
                    delete document.documentElement.dataset.theme;
                }

                document.querySelector('meta[name="theme-color"]').content =
                    value === 'eink' ? '#ffffff' : '#10131a';

                try {
                    localStorage.setItem(guildSimThemeKey, value);
                } catch { }
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
